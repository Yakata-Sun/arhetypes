<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Общество: Новые смыслы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Цвета и переменные темы (светлая / тёмная) */
:root{--bg:#f0f2f5;--card:#fff;--tx:#222;--mut:#6d7885;--ac:#0077ff;--ok:#4bb34b;--bad:#e64646;--sh:0 2px 10px rgba(0,20,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#19191a;--card:#232324;--tx:#e1e3e6;--mut:#909499;--sh:0 2px 10px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#19191a;--card:#232324;--tx:#e1e3e6;--mut:#909499;--sh:0 2px 10px rgba(0,0,0,.4)}
/* Базовые стили страницы */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:560px;margin:0 auto;padding:20px 16px 28px}
/* Экраны: виден один, плавное появление через opacity/transform (классы .active и .show ставит JS) */
.screen{display:none;opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s}
.screen.active{display:block}.screen.show{opacity:1;transform:none}
h1{font-size:26px;line-height:1.2;margin:8px 0 6px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 18px}
/* Сетка карточек архетипов (экран 1) */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.arch{background:var(--card);border:2px solid transparent;border-radius:14px;box-shadow:var(--sh);min-height:64px;padding:12px 8px;font-family:inherit;font-weight:600;font-size:16px;color:var(--tx);cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.arch:active{transform:scale(.97)}
.arch.highlight{border-color:var(--ac);background:rgba(0,119,255,.12)}
.arch.selected{border-color:var(--ok);background:rgba(75,179,75,.16);transform:scale(1.04)}
/* Блоки-гильдии: цвет рамки и фона берётся из переменной --g (RGB), которую задаёт JS */
.guild{margin-top:14px;padding:12px;border:2px solid rgba(var(--g),.55);background:rgba(var(--g),.1);border-radius:16px}
.guild h2{font-size:16px;margin:0 0 10px}
.guild .grid{grid-template-columns:repeat(3,1fr);gap:8px}
.guild .arch{font-size:14px;padding:10px 4px;min-height:58px;overflow-wrap:anywhere}
/* Основные кнопки; .locked блокирует клики на время рулетки */
.btn{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-family:inherit;font-weight:600;font-size:17px;cursor:pointer;transition:opacity .2s,transform .15s}
.btn:active{transform:scale(.98)}
.locked .arch,.locked .btn{pointer-events:none}.locked .btn{opacity:.6}
/* Панель шкал (экран 2): Дар и Тень в ряд (.row2), Источник ниже */
.dash{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:16px}
.m+.m{margin-top:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2 .m+.m{margin-top:0}
.row2+.m{margin-top:13px}
.row2 .m b{font-size:13px;flex-wrap:wrap;gap:0 6px}
.m b{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.m b span{color:var(--mut);font-weight:500}
/* Полоса шкалы и заливка; шкала Тени краснеет и мигает при классе .alarm (значение > 70%) */
.track{position:relative;height:10px;border-radius:5px;background:rgba(120,130,150,.22)}
.fill{height:100%;width:0;border-radius:5px;background:var(--ac);transition:width .5s cubic-bezier(.3,.8,.3,1),background .3s}
#mGift .fill{background:var(--ok)}
#mShadow.alarm .fill{background:var(--bad);animation:pulse 1s infinite}
#mShadow.alarm b{color:var(--bad)}
@keyframes pulse{50%{opacity:.55}}
/* Шкала «Источник»: риска центра, бегунок и подписи краёв */
.scale .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--mut);opacity:.5}
.dot{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--ac);box-shadow:0 1px 6px rgba(0,119,255,.5);transition:left .5s cubic-bezier(.3,.8,.3,1)}
.ends{display:flex;justify-content:space-between;font-size:17px;font-weight:600;margin-top:8px}
#mSource b{justify-content:center}
/* Зона свайпа и сама карточка (.pic — картинка, .full — затемнение с полным текстом, .hint — кнопки выбора) */
.zone{position:relative;height:400px;touch-action:pan-y;user-select:none}
.swcard{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:0 6px 24px rgba(0,20,60,.14);cursor:grab;touch-action:pan-y;will-change:transform;transition:transform .3s ease,opacity .3s}
.pic{position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,119,255,.25),rgba(75,179,75,.2)) center/cover no-repeat;pointer-events:none}
.swcard.drag{transition:none;cursor:grabbing}
/* Затемнение с полным текстом выбора: появляется при наведении, свайпе или первом касании */
.full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:72px 22px 24px;color:#fff;font-weight:600;font-size:18px;line-height:1.45;background:rgba(8,12,24,.64);text-shadow:0 1px 3px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.full.show{opacity:1}
/* Кнопки выбора сверху карточки: .hl — левая (красная), .hr — правая (зелёная); .on — «залита» после порога свайпа */
.hint{position:absolute;top:12px;max-width:47%;padding:8px 11px;border-radius:12px;font-weight:700;font-size:14px;line-height:1.2;background:var(--card);border:2px solid;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;transition:opacity .2s,background .2s,color .2s}
.hl{left:12px;color:var(--bad);border-color:var(--bad)}.hr{right:12px;color:var(--ok);border-color:var(--ok)}
.hl.on{background:var(--bad);color:#fff}.hr.on{background:var(--ok);color:#fff}
/* Текст ситуации над карточкой */
.qcap{margin:0 4px 14px;text-align:center;font-size:17px;line-height:1.45;font-weight:500;min-height:6em;transition:opacity .3s}
.cnt{text-align:center;color:var(--mut);font-size:14px;margin-top:12px}
/* Итоговый экран (экран 3) */
.review{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.review p{margin:0 0 10px}.review p:last-child{margin:0}
.qs h2{font-size:18px;margin:0 0 10px}.qs ol{margin:0;padding-left:20px}.qs li{margin-bottom:10px}
/* Экран описания архетипа: цветная полоса слева берётся из цвета гильдии (--g) */
.hero{border-left:6px solid rgb(var(--g,0,119,255))}
#infoGuild{margin-bottom:0}#infoName{margin-bottom:14px}
.gt+.gt{margin-top:12px}.gt b{display:block;margin-bottom:2px}.gt p{margin:0}
.btn.ghost{background:transparent;color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac);margin-top:10px}
/* Отключаем анимации, если пользователь просит их уменьшить */
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<!-- Корневой контейнер: три экрана, виден только один -->
<div id="app">
 <!-- ЭКРАН 1: выбор архетипа (гильдии строятся из JS в #guilds) -->
<section class="screen" id="s1">
  <h1>Общество: Новые смыслы</h1>
  <p class="sub">Выберите свой архетип или доверьтесь случаю, чтобы начать путь</p>
  <button class="btn" id="rnd">Случайный выбор</button>
  <div id="guilds"></div>
 </section>
 <!-- ЭКРАН-ПЕРЕХОД: описание выбранного архетипа (заполняется из JS функцией fillInfo) -->
 <section class="screen" id="sInfo">
  <p class="sub" id="infoGuild"></p>
  <h1 id="infoName"></h1>
  <div class="review hero" id="infoCard"><p id="infoDesc"></p></div>
  <div class="review">
   <div class="gt"><b>🌟 Дар</b><p id="infoGift"></p></div>
   <div class="gt"><b>🪤 Ловушка</b><p id="infoShadow"></p></div>
  </div>
  <button class="btn" id="startBtn">Начать путь</button>
  <button class="btn ghost" id="backBtn">Выбрать другой архетип</button>
 </section>
 <!-- ЭКРАН 2: локация вызова — шкалы, вопрос и карточка со свайпом -->
<section class="screen" id="s2">
  <h1 id="t2">Локация вызова</h1>
  <p class="sub" id="path"></p>
  <div class="dash">
   <!-- Дар и Тень: по половине строки -->
<div class="row2">
   <div class="m" id="mGift"><b>🌟 Проявление Дара<span></span></b><div class="track"><div class="fill"></div></div></div>
   <div class="m" id="mShadow"><b>🪤 Ваши Ловушки<span></span></b><div class="track"><div class="fill"></div></div></div>
   </div>
   <!-- Источник: бегунок между Общностью (0%) и Независимостью (100%) -->
<div class="m scale" id="mSource"><b><span></span></b><div class="track"><div class="dot"></div></div><div class="ends"><span>Общность</span><span>Независимость</span></div></div>
  </div>
  <p class="qcap" id="qcap"></p>
  <div class="zone" id="zone"></div>
  <div class="cnt" id="cnt"></div>
 </section>
 <!-- ЭКРАН 3: итог и вопросы для саморефлексии -->
<section class="screen" id="s3">
  <h1>Локация сборки 🧩</h1>
  <p class="sub">Ваш уникальный срез личности и интеграция опыта</p>
  <div class="review" id="rev"></div>
  <div class="review qs"><h2>Вопросы для саморефлексии:</h2><ol id="qs"></ol></div>
  <button class="btn" id="again">Пройти заново</button>
 </section>
</div>
<!-- VK Bridge: связь мини-приложения с клиентом ВКонтакте (официальная сборка для браузера) -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<!-- Файлы с колодами карточек. У каждого своя переменная (creatorsDecks, ...), её читает блок «ПОДКЛЮЧЕНИЕ КОЛОД» ниже -->
<script src="creatorsDecks.js"></script>
<script src="explorersDecks.js"></script>
<script src="keepersDecks.js"></script>
<script src="guidesDecks.js"></script>
<!-- Движок игры -->
<script>
/* ===================== VK BRIDGE =====================
   Сообщаем клиенту ВКонтакте, что приложение загрузилось (без VKWebAppInit мини-приложение может не открыться).
   Вне ВК (обычный браузер) или если библиотека не загрузилась, блок просто пропускается, и игра работает как раньше. */
if(typeof vkBridge!=='undefined'){
 // Тема оформления: ВК присылает схему в событии VKWebAppUpdateConfig; ставим data-theme, и срабатывают наши CSS-переменные
 vkBridge.subscribe(e=>{
  const ev=e&&e.detail;
  if(ev&&ev.type==='VKWebAppUpdateConfig'&&ev.data&&ev.data.scheme){
   const dark=['space_gray','vkcom_dark'].includes(ev.data.scheme);
   document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  }
 });
 vkBridge.send('VKWebAppInit').catch(err=>console.warn('VK Bridge:',err));
}

/* ===================== ДАННЫЕ ===================== */
// Гильдии: название, цвет (RGB для рамки/фона) и список архетипов. Названия архетипов должны совпадать с ключами в файлах колод.
const GUILDS=[
{name:"🧭 Гильдия Исследователей",rgb:"92,107,230",list:["Простодушный","Искатель","Мудрец"]},
{name:"✨ Гильдия Создателей",rgb:"245,158,11",list:["Герой","Бунтарь","Маг"]},
{name:"🛠 Гильдия Хранителей",rgb:"16,185,129",list:["Творец","Правитель","Заботливый"]},
{name:"❤️ Гильдия Проводников",rgb:"236,72,153",list:["Славный малый","Влюбленный","Шут"]}];
// Плоский список архетипов в порядке гильдий (по нему крутится рулетка)
const ARCH=GUILDS.flatMap(g=>g.list);
/* ===================== ПОДКЛЮЧЕНИЕ КОЛОД =====================
   Карточки лежат в отдельных файлах (creatorsDecks.js и т. д.). Формат карточки во внешнем файле:
   { question, image (необязательно), left:{short (2 слова), text, effect}, right:{...} }
   effect = { gift, shadow, source } — на сколько пунктов сдвинуть шкалы. Для source минус — к Общности, плюс — к Независимости. */

// Колоды по архетипам; сначала пустые, дальше заполняются из файлов
const questDecks=Object.fromEntries(ARCH.map(a=>[a,[]]));

// Приводит карточку из файла к внутреннему виду движка
const normalizeCard=c=>({
 text:c.question, image:c.image,
 left:{label:c.left.text,short:c.left.short,effects:c.left.effect},
 right:{label:c.right.text,short:c.right.short,effects:c.right.effect}
});

// Кладёт колоды из одного файла в questDecks; битые карточки пропускает, в консоль пишет предупреждение
function mergeDecks(ext){
 for(const a in ext){
  if(!questDecks[a]){console.warn('Неизвестный архетип в колоде:',a);continue}
  const ok=ext[a].filter(c=>c&&c.question&&c.left&&c.right&&c.left.effect&&c.right.effect);
  if(ok.length!==ext[a].length)console.warn('Часть карточек пропущена (неполный формат):',a);
  if(ok.length)questDecks[a]=ok.map(normalizeCard);
 }
}

// Список файлов-колод. typeof защищает от ошибки, если файл не загрузился. Новый файл — новая строка здесь и тег <script src> выше.
[
 ['creatorsDecks',typeof creatorsDecks!=='undefined'?creatorsDecks:null],
 ['explorersDecks',typeof explorersDecks!=='undefined'?explorersDecks:null],
 ['keepersDecks',typeof keepersDecks!=='undefined'?keepersDecks:null],
 ['guidesDecks',typeof guidesDecks!=='undefined'?guidesDecks:null]
].forEach(([name,d])=>d?mergeDecks(d):console.warn('Файл колоды не загружен:',name));

// Вопросы для саморефлексии на итоговом экране: по три на каждый архетип
const coachingQuestions={
"Герой":["В каких сферах жизни вы боретесь там, где можно договориться?","Что для вас означает «победа»? Как ее достичь без разрушения отношений?","Какую внутреннюю ценность вы защищаете усерднее всего?"],
"Бунтарь":["Что в вашей жизни действительно требует перемен, а что вы отвергаете по привычке сопротивляться?","Какую свободу вы ищете? От чего именно?","Когда ваш протест полезен?"],
"Маг":["К трансформации чего вы идете?","В чем ценность вашей трансформации?","Какую силу вашего влияния важно направлять бережно?"],
"Славный малый":["Где вы ради принадлежности заглушаете собственный голос?","Что делает вас по-настоящему собой?","Что значит быть «своим» для самого себя?"],
"Влюбленный":["Что вызывает у вас подлинное восхищение и тепло прямо сейчас?","Где близость с другими требует от вас предать себя?","Как проявить любовь к себе так же щедро, как о близких?"],
"Шут":["Что в вашей жизни дарит вам легкость и улыбку?","За какой шуткой вы прячете важные чувства?","Когда ваши шутки приносят радость окружающим, а когда они являются просто вашей защитой?"],
"Заботливый":["В чём вы помогаете другим, забывая о собственных потребностях?","Что даёт вам право принять помощь?","Какое служение наполняет вас, а не истощает?","Всегда ли нужна ваша забота?"],
"Творец":["Какая идея просит воплощения, пока вы её откладываете?","Что мешает вам показать своё творение миру?","Как несовершенство может стать частью вашего замысла?","Как воплощать идеи, когда личных сил меньше, чем нужно для воплощения?"],
"Правитель":["За что в вашей жизни вы готовы взять ответственность, а что можно доверить другим?","Как выглядит порядок, в котором есть место живому?","Что вы хотите оставить после себя?"],
"Простодушный":["Во что вы искренне верите, несмотря на сомнения окружающих?","Где доверие к миру помогает вам, а где стоит прислушаться к интуиции?","Что для вас значит простое счастье?"],
"Искатель":["Каких новых горизонтов или знаний ищет ваша душа в данный момент?","Что мешает вам остановиться и насладиться текущим моментом?","Какое внутреннее пространство вы сейчас исследуете?","Какие ваши знания вам уже давно пора начать применять?"],
"Мудрец":["Как накопленный вами опыт и знания могут послужить обществу прямо сейчас?","В чем вы ищете глубинный смысл, упуская возможности?","Какая истина освобождает вас от внутренних сомнений?"]};

/* ===================== СОСТОЯНИЕ И ХЕЛПЕРЫ ===================== */
const $=id=>document.getElementById(id);            // короткий доступ к элементу по id
const clamp=v=>Math.max(0,Math.min(100,v));         // держит значение шкалы в пределах 0–100 (игра не «проигрывается»)
const START={gift:50,shadow:20,source:50};          // стартовые значения шкал
const THRESHOLD=90;                                 // порог свайпа в пикселях
let arch=null;                                      // выбранный архетип
let idx=0;                                          // номер текущей карточки в колоде
let state={...START};                               // текущие значения шкал
let busy=false;                                     // true — идёт выбор или рулетка, клики блокируются
let chooseCurrent=null;                             // функция выбора для текущей карточки (нужна клавишам ← →)

/* ===================== ЭКРАНЫ ===================== */
// Показывает экран: делает его видимым, затем запускает плавное появление; остальные скрывает
function show(id){
 document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('show');if(s.id!==id)s.classList.remove('active')});
 const s=$(id);s.classList.add('active');
 void s.offsetWidth;                                // принудительный reflow, чтобы сработала анимация
 requestAnimationFrame(()=>s.classList.add('show'));
 scrollTo(0,0);
}
// Переход: гасит текущий экран, через 350 мс выполняет fn (подготовка нового экрана) и показывает новый
function go(id,fn){
 const cur=document.querySelector('.screen.show');if(cur)cur.classList.remove('show');
 setTimeout(()=>{fn&&fn();show(id)},cur?350:0);
}

/* ===================== ЭКРАН 1: ВЫБОР АРХЕТИПА ===================== */
// Строим блоки гильдий и кнопки-архетипы из массива GUILDS
const gbox=$('guilds');
GUILDS.forEach(g=>{
 const sec=document.createElement('section');sec.className='guild';sec.style.setProperty('--g',g.rgb);
 sec.innerHTML='<h2></h2><div class="grid"></div>';
 sec.firstChild.textContent=g.name;                 // текст через textContent — без риска HTML-вставки
 g.list.forEach(a=>{
  const b=document.createElement('button');b.className='arch';b.textContent=a;b.onclick=()=>pick(b);
  sec.lastChild.appendChild(b);
 });
 gbox.appendChild(sec);
});
const cards=[...document.querySelectorAll('.arch')];  // все кнопки архетипов в порядке гильдий

// Фиксирует выбор архетипа и через 800 мс переходит на экран с описанием
function pick(el){
 if(busy)return;busy=true;
 cards.forEach(c=>c.classList.remove('highlight','selected'));
 el.classList.add('selected');arch=el.textContent;
 setTimeout(()=>go('sInfo',fillInfo),800);
}

// Рулетка: подсветка бежит по карточкам, шаги замедляются (интервал растёт квадратично, ~2,7 с), последняя подсветка = выбор
$('rnd').onclick=()=>{
 if(busy)return;busy=true;$('s1').classList.add('locked');   // на время рулетки клики отключены
 cards.forEach(c=>c.classList.remove('selected'));
 const L=cards.length,N=24;                                  // L — число карточек, N — число шагов
 const target=Math.floor(Math.random()*L);                   // заранее выбираем результат
 const start=(((target-(N-1))%L)+L)%L;                       // стартуем так, чтобы после N шагов остановиться на target
 let i=0,prev=null;
 (function step(){
  if(prev)prev.classList.remove('highlight');
  const c=cards[(start+i)%L];c.classList.add('highlight');prev=c;
  if(++i<N)setTimeout(step,50+i*i*.35);
  else setTimeout(()=>{c.classList.remove('highlight');busy=false;pick(c)},250);
 })();
};

/* ===================== ЭКРАН-ПЕРЕХОД: ОПИСАНИЕ АРХЕТИПА ===================== */
const cap1=t=>t.charAt(0).toUpperCase()+t.slice(1)+'.';   // «мужество…» → «Мужество….»
// Заполняет экран описания: гильдия, название, текст, Дар и Тень архетипа
function fillInfo(){
 const g=GUILDS.find(g=>g.list.includes(arch));
 $('infoGuild').textContent=g.name;
 $('infoName').textContent=arch;
 $('infoDesc').textContent=archetypeInfo[arch]||'';
 $('infoGift').textContent=cap1(nature[arch][0]);
 $('infoShadow').textContent=cap1(nature[arch][1]);
 $('infoCard').style.setProperty('--g',g.rgb);            // цвет полосы = цвет гильдии
 $('startBtn').disabled=false;
}
// «Начать путь» → экран 2 (от двойного нажатия защищаемся блокировкой кнопки)
$('startBtn').onclick=()=>{
 const b=$('startBtn');if(b.disabled)return;b.disabled=true;
 go('s2',startQuest);
};

/* ===================== ЭКРАН 2: ЛОКАЦИЯ ВЫЗОВА ===================== */
// Ссылки на элементы шкал берём один раз, чтобы не искать их при каждом обновлении
const ui={
 giftFill:$('mGift').querySelector('.fill'),     giftVal:$('mGift').querySelector('span'),
 shadowBox:$('mShadow'),shadowFill:$('mShadow').querySelector('.fill'),shadowVal:$('mShadow').querySelector('span'),
 dot:$('mSource').querySelector('.dot'),         srcVal:$('mSource').querySelector('span')
};
// Перерисовывает все три шкалы по текущему state
function render(){
 ui.giftFill.style.width=state.gift+'%';     ui.giftVal.textContent=Math.round(state.gift)+'%';
 ui.shadowFill.style.width=state.shadow+'%'; ui.shadowVal.textContent=Math.round(state.shadow)+'%';
 ui.shadowBox.classList.toggle('alarm',state.shadow>70);     // Тень > 70% — красная и мигает
 ui.dot.style.left=state.source+'%';         ui.srcVal.textContent=Math.round(state.source)+'%';
}
// Начало квеста: сброс шкал и счётчика, подпись с архетипом, первая карточка
function startQuest(){
 idx=0;state={...START};
 $('path').textContent='Путь Архетипа: '+arch;render();nextCard();
}
// Применяет эффекты выбора к шкалам (с ограничением 0–100); неизвестные ключи игнорируем
function applyEffects(e){
 for(const k in e)if(k in state)state[k]=clamp(state[k]+e[k]);
 render();
}
// Короткая подпись кнопки: поле short, а если его нет — первые два слова полного текста
const shortLabel=o=>o.short||o.label.split(/\s+/).slice(0,2).join(' ');

// Показывает следующую карточку; если колода закончилась — переходит к итогу
function nextCard(){
 const zone=$('zone'),deck=questDecks[arch]||[];
 zone.innerHTML='';
 if(idx>=deck.length){
  if(!deck.length)console.warn('Пустая колода для архетипа:',arch);
  $('qcap').textContent='';setTimeout(()=>go('s3',finish),300);return;
 }
 const d=deck[idx];
 $('cnt').textContent='Карточка '+(idx+1)+' из '+deck.length;
 const nxt=deck[idx+1];if(nxt&&nxt.image)new Image().src=nxt.image;   // заранее грузим картинку следующей карточки

 const c=document.createElement('div');c.className='swcard';
 c.innerHTML='<div class="pic"></div><div class="full"></div><div class="hint hl" role="button"></div><div class="hint hr" role="button"></div>';
 c.querySelector('.hl').textContent=shortLabel(d.left);
 c.querySelector('.hr').textContent=shortLabel(d.right);
 if(d.image)c.querySelector('.pic').style.backgroundImage='url("'+d.image.replace(/"/g,'%22')+'")';

 // Текст вопроса над карточкой: плавно гасим и показываем новый
 const cap=$('qcap');cap.style.opacity=0;
 setTimeout(()=>{cap.textContent=d.text;cap.style.opacity=1},idx?250:0);

 // Появление карточки: из прозрачной и чуть уменьшенной (два rAF — чтобы браузер успел применить стартовые стили)
 c.style.opacity=0;c.style.transform='scale(.94)';zone.appendChild(c);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.opacity=1;c.style.transform=''}));
 attachSwipe(c,d);
}

// Вся логика управления карточкой: перетаскивание мышью и пальцем, тап по кнопкам, полный текст выбора
function attachSwipe(c,d){
 const hl=c.querySelector('.hl'),hr=c.querySelector('.hr'),full=c.querySelector('.full');
 let sx=0,dx=0;          // sx — x начала касания, dx — текущее смещение
 let on=false;           // идёт перетаскивание
 let done=false;         // выбор уже сделан, карточка улетает
 let tapSide=null;       // 'l'/'r', если касание началось на кнопке
 let ptype='';           // тип указателя: mouse / touch / pen
 let preview=null;       // сторона, чей полный текст уже показан по первому касанию (для сенсорных экранов)
 let shown=null;         // сторона, текст которой сейчас на затемнении (чтобы не перерисовывать зря)

 // Затемнение с полным текстом выбранной стороны
 const showFull=side=>{
  if(shown===side)return;shown=side;
  full.textContent=(side==='l'?d.left:d.right).label;full.classList.add('show');
 };
 const hideFull=()=>{shown=null;preview=null;full.classList.remove('show')};

 // Выбор стороны: карточка улетает, эффекты применяются, через 320 мс — следующая карточка
 const choose=left=>{
  if(done)return;done=true;chooseCurrent=null;
  c.classList.remove('drag');
  c.style.transform=`translateX(${left?-600:600}px) rotate(${left?-30:30}deg)`;c.style.opacity=0;
  applyEffects((left?d.left:d.right).effects);
  idx++;setTimeout(nextCard,320);
 };
 chooseCurrent=choose;   // тот же выбор доступен с клавиатуры

 // Возврат карточки в центр, если порог не достигнут
 const snapBack=()=>{
  c.style.transform='';hl.style.opacity=hr.style.opacity='';
  hl.classList.remove('on');hr.classList.remove('on');hideFull();
 };

 // Наведение мыши на кнопку показывает полный текст (на сенсорных наведения нет)
 [[hl,'l'],[hr,'r']].forEach(([el,side])=>{
  el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&!on)showFull(side)});
  el.addEventListener('pointerleave',()=>{if(!on)hideFull()});
 });

 // Начало касания / нажатия
 c.addEventListener('pointerdown',e=>{
  if(done)return;
  const h=e.target.closest('.hint');
  tapSide=h?(h.classList.contains('hl')?'l':'r'):null;
  ptype=e.pointerType;on=true;sx=e.clientX;dx=0;
  c.classList.add('drag');                 // на время перетаскивания отключаем CSS-переход
  c.setPointerCapture(e.pointerId);        // получаем события, даже если палец/мышь ушли за карточку
 });

 // Перетаскивание: сдвиг и поворот карточки, подсветка кнопок, полный текст после ~1/3 порога
 c.addEventListener('pointermove',e=>{
  if(!on)return;
  dx=e.clientX-sx;
  c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
  const k=Math.min(Math.abs(dx)/THRESHOLD,1);   // 0…1 — насколько близко к порогу
  hl.style.opacity=dx<0?1:1-.5*k;hr.style.opacity=dx>0?1:1-.5*k;
  hl.classList.toggle('on',dx<0&&k>=1);hr.classList.toggle('on',dx>0&&k>=1);
  if(k>.35)showFull(dx<0?'l':'r');else hideFull();
 });

 // Конец жесте; cancelled=true, если браузер забрал жест (например, началась вертикальная прокрутка)
 const end=cancelled=>{
  if(!on)return;on=false;c.classList.remove('drag');
  const tap=!cancelled&&tapSide&&Math.abs(dx)<=6;         // почти без движения по кнопке = тап
  // Сенсорный экран: первый тап по кнопке только показывает полный текст, второй подтверждает выбор
  if(tap&&ptype!=='mouse'&&preview!==tapSide){showFull(tapSide);preview=tapSide;c.style.transform='';return}
  if(!cancelled&&(Math.abs(dx)>THRESHOLD||tap))choose(tap?tapSide==='l':dx<0);
  else snapBack();
 };
 c.addEventListener('pointerup',()=>end(false));
 c.addEventListener('pointercancel',()=>end(true));
}

// Клавиатура: ← выбирает левый вариант, → правый (удобно на компьютере и для доступности)
document.addEventListener('keydown',e=>{
 if(!chooseCurrent||!$('s2').classList.contains('show'))return;
 if(e.key==='ArrowLeft')chooseCurrent(true);
 else if(e.key==='ArrowRight')chooseCurrent(false);
});

/* ===================== ЭКРАН 3: ИТОГ ===================== */
// Описания архетипов для экрана между выбором и квестом (по 2 предложения: суть и «путь»)
const archetypeInfo={

"Искатель":"Вам тесно в привычных рамках: вас зовет горизонт, новые знания и опыт. Ваш путь — искать себя, постоянно развиваться и находить дом внутри себя.",
"Мудрец":"Вы стремитесь понять мир, отличить истину от иллюзий и поделиться знанием. Ваш путь — превращать понимание в действие, а мудрость в служение людям.",
"Герой":"Вы готовы встречать вызовы лицом к лицу и доказывать делом, на что способны. Вам надо научиться направлять силу и волю на защиту того, что действительно ценно не только для вас, но и для всего окружающего мира. </br> Выйти за рамки только личного осознания цели.",
"Бунтарь":"Вы замечаете то, что отжило своё, не боитесь и любите нарушать правила. Управляйте своим бунтом, открывая горизонты нового.",
"Маг":"Вы видите скрытые связи и умеете преображать реальность: себя, людей, обстоятельства. Научитесь использовать свое влияние бережно и осознанно.",
"Творец":"Вы воплощаете идеи в жизнь и создаёте то, чего ещё не было. Доверяйте своему замыслу и окружению, позвольте появится новому",
"Правитель":"Вы создаёте порядок, берёте ответственность и объединяете людей вокруг общего смысла. Оставьте в своей структуре место новому и живому. </br> Поверьте в смыслы обновления",
"Заботливый":"Вы щедры на поддержку и чувствуете, когда другим нужна помощь. Научитесь чувствовать когда ваша забота действительно нужна, а когда она в тягость. </br> Поверьте в силы и способности окружающих вас людей",
"Славный малый":"Вы цените свою принадлежность к обществу, вы искренне любите простое человеческое тепло. Вы можете оставаться собой даже в самом близком кругу и это ваш драгоценный дар",
"Влюбленный":"Вы живёте через близость, красоту и глубокие чувства. Любите мир и людей, не растворяясь в них.",
"Шут":"Вы приносите в мир лёгкость, игру и умение смеяться над собой. Используйте свой юмор как мост к людям, а не как защиту от чувств."};
// Для итогового текста: [Дар, Тень] каждого архетипа
const nature={
"Герой":["мужество и воля преодолевать трудности и идти к победе","стремление побеждать любой ценой и доказывать свою силу"],
"Бунтарь":["смелость разрушать отжившее и начинать новое","разрушение ради разрушения и отказ от любых правил"],
"Маг":["способность преображать реальность и видеть скрытые связи","манипуляция и соблазн влиять на других втайне"],
"Славный малый":["искренность, теплота и умение принимать людей","угодничество и страх остаться вне группы"],
"Влюбленный":["способность к близости, страсти и глубокому вовлечению","зависимость от одобрения и потеря себя в другом"],
"Шут":["лёгкость, игра и способность видеть жизнь с юмором","уход в шутку от серьёзных чувств и обесценивание важного"],
"Заботливый":["щедрость, сострадание и готовность поддержать","самопожертвование, навязывание своей заботы, скрытый упрёк тем, кому вы помогаете"],
"Творец":["воображение и дар воплощать идеи в жизнь","перфекционизм и замыкание в собственном замысле"],
"Правитель":["умение выстраивать порядок и брать ответственность","контроль, властность и страх потерять влияние"],
"Простодушный":["вера, оптимизм и способность видеть хорошее","наивность и отрицание неприятной реальности, инфантильность, уход от ответственности за себя, свои эмоции и действия"],
"Искатель":["жажда открытий и независимость мышления","вечная неудовлетворённость и страх остановиться"],
"Мудрец":["стремление к истине и способность к глубокому анализу","отстранённость и бесконечные сомнения вместо действия"]};
// Собирает итоговый текст по финальным значениям шкал
function summary(){
 const {gift,shadow,source}=state,[gf,sh]=nature[arch];
 // Текст про Дар по уровню шкалы (>=70 / 40–69 / <40)
 const gl=gift>=70?"вы уверенно опираетесь на этот ресурс":gift>=40?"этот ресурс проявляется, но ему есть куда расти":"этот ресурс пока в тени и ждёт вашего внимания";
 // Текст про Тень (>70 / 35–70 / <35)
 const sl=shadow>70?"Вы в ловушке активного архетипа: сейчас нужны осознанность и внимание к себе. Посмотрите на себя в роли наблюдателя.":shadow>=35?"Вы почти в ловушке вашего активного архетипа, будьте внимательнее":"Вы хорошо чувствуете ловушки и дары этого архетипа";
 // Текст про баланс Общность/Независимость (<40 / >60 / середина)
 const al=source<40?"Вы склонны смещать фокус на Общность, порой рискуя раствориться в интересах других и потерять собственную аутентичность.":source>60?"Вы держите курс на жесткую Независимость и эгоцентризм, что дает свободу, но может создавать барьеры для истинной синергии в социуме.":"Вы демонстрируете прекрасный внутренний баланс между личными границами и ценностью общего блага.";
 // Два абзаца итога: про Дар и Тень архетипа, затем про Источник
 return [`Путь архетипа «${arch}». Дар — ${gf} (${Math.round(gift)}%): ${gl}. Ловушка — ${sh} (${Math.round(shadow)}%). ${sl}.`,al];
}
// Создаёт элемент с текстом (textContent — безопасно)
const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
// Заполняет итоговый экран: абзацы итога и три вопроса для саморефлексии
function finish(){
 $('rev').replaceChildren(...summary().map(t=>el('p',t)));
 $('qs').replaceChildren(...(coachingQuestions[arch]||[]).map(q=>el('li',q)));
}
// Возврат на экран 1 со сбросом всего состояния («Пройти заново» и «Выбрать другой архетип»)
const restart=()=>go('s1',()=>{
 busy=false;arch=null;chooseCurrent=null;state={...START};
 $('s1').classList.remove('locked');
 cards.forEach(c=>c.classList.remove('highlight','selected'));
});
$('again').onclick=restart;     // с итогового экрана
$('backBtn').onclick=restart;   // с экрана описания: выбрать другой архетип
show('s1');   // старт игры: показываем экран выбора архетипа
</script>
