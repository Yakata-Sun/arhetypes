<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Общество: Новые смыслы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f0f2f5;--card:#fff;--tx:#222;--mut:#6d7885;--ac:#0077ff;--ok:#4bb34b;--bad:#e64646;--sh:0 2px 10px rgba(0,20,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#19191a;--card:#232324;--tx:#e1e3e6;--mut:#909499;--sh:0 2px 10px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#19191a;--card:#232324;--tx:#e1e3e6;--mut:#909499;--sh:0 2px 10px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:560px;margin:0 auto;padding:20px 16px 28px}
.screen{display:none;opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s}
.screen.active{display:block}.screen.show{opacity:1;transform:none}
h1{font-size:26px;line-height:1.2;margin:8px 0 6px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.arch{background:var(--card);border:2px solid transparent;border-radius:14px;box-shadow:var(--sh);min-height:64px;padding:12px 8px;font:600 16px inherit;font-family:inherit;color:var(--tx);cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.arch:active{transform:scale(.97)}
.arch.highlight{border-color:var(--ac);background:rgba(0,119,255,.12)}
.arch.selected{border-color:var(--ok);background:rgba(75,179,75,.16);transform:scale(1.04)}
.guild{margin-top:14px;padding:12px;border:2px solid rgba(var(--g),.55);background:rgba(var(--g),.1);border-radius:16px}
.guild h2{font-size:16px;margin:0 0 10px}
.guild .grid{grid-template-columns:repeat(3,1fr);gap:8px}
.guild .arch{font-size:14px;padding:10px 4px;min-height:58px;overflow-wrap:anywhere}
.btn{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 17px inherit;font-family:inherit;cursor:pointer;transition:opacity .2s,transform .15s}
.btn:active{transform:scale(.98)}
.locked .arch,.locked .btn{pointer-events:none}.locked .btn{opacity:.6}
.dash{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:16px}
.m+.m{margin-top:13px}
.m b{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.m b span{color:var(--mut);font-weight:500}
.track{position:relative;height:10px;border-radius:5px;background:rgba(120,130,150,.22)}
.fill{height:100%;width:0;border-radius:5px;background:var(--ac);transition:width .5s cubic-bezier(.3,.8,.3,1),background .3s}
#mGift .fill{background:var(--ok)}
#mShadow.alarm .fill{background:var(--bad);animation:pulse 1s infinite}
#mShadow.alarm b{color:var(--bad)}
@keyframes pulse{50%{opacity:.55}}
.scale .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--mut);opacity:.5}
.dot{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--ac);box-shadow:0 1px 6px rgba(0,119,255,.5);transition:left .5s cubic-bezier(.3,.8,.3,1)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.zone{position:relative;height:400px;touch-action:pan-y;user-select:none}
.swcard{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:0 6px 24px rgba(0,20,60,.14);cursor:grab;touch-action:pan-y;transition:transform .3s ease,opacity .3s}
.pic{position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,119,255,.25),rgba(75,179,75,.2)) center/cover no-repeat;pointer-events:none}
.swcard.drag{transition:none;cursor:grabbing}
.hint{position:absolute;top:12px;max-width:47%;padding:8px 11px;border-radius:12px;font-weight:700;font-size:13px;line-height:1.2;background:var(--card);border:2px solid;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;transition:opacity .2s,background .2s,color .2s}
.hl{left:12px;color:var(--bad);border-color:var(--bad)}.hr{right:12px;color:var(--ok);border-color:var(--ok)}
.hl.on{background:var(--bad);color:#fff}.hr.on{background:var(--ok);color:#fff}
.qcap{margin:16px 4px 0;text-align:center;font-size:17px;line-height:1.45;font-weight:500;min-height:6em;transition:opacity .3s}
.cnt{text-align:center;color:var(--mut);font-size:14px;margin-top:12px}
.review{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.review p{margin:0 0 10px}.review p:last-child{margin:0}
.qs h2{font-size:18px;margin:0 0 10px}.qs ol{margin:0;padding-left:20px}.qs li{margin-bottom:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
 <section class="screen" id="s1">
  <h1>Общество: Новые смыслы</h1>
  <p class="sub">Выберите свой архетип или доверьтесь случаю, чтобы начать путь</p>
  <button class="btn" id="rnd">Случайный выбор</button>
  <div id="guilds"></div>
 </section>
 <section class="screen" id="s2">
  <h1 id="t2">Локация вызова</h1>
  <p class="sub" id="path"></p>
  <div class="dash">
   <div class="m" id="mGift"><b>🌟 Проявление Дара<span></span></b><div class="track"><div class="fill"></div></div></div>
   <div class="m" id="mShadow"><b>🪤 Давление Тени<span></span></b><div class="track"><div class="fill"></div></div></div>
   <div class="m scale" id="mSource"><b>🧭 Источник<span></span></b><div class="track"><div class="dot"></div></div><div class="ends"><span>Общность</span><span>Независимость</span></div></div>
  </div>
  <div class="zone" id="zone"></div>
  <p class="qcap" id="qcap"></p>
  <div class="cnt" id="cnt"></div>
 </section>
 <section class="screen" id="s3">
  <h1>Локация сборки 🧩</h1>
  <p class="sub">Ваш уникальный срез личности и интеграция опыта</p>
  <div class="review" id="rev"></div>
  <div class="review qs"><h2>Вопросы для саморефлексии:</h2><ol id="qs"></ol></div>
  <button class="btn" id="again">Пройти заново</button>
 </section>
</div>
<script src="creatorsDecks.js"></script>
<script>
/* ===== CONTENT ===== */
const GUILDS=[
{name:"🧭 Гильдия Исследователей",rgb:"92,107,230",list:["Простодушный","Искатель","Мудрец"]},
{name:"✨ Гильдия Создателей",rgb:"245,158,11",list:["Герой","Бунтарь","Маг"]},
{name:"🛠 Гильдия Хранителей",rgb:"16,185,129",list:["Творец","Правитель","Заботливый"]},
{name:"❤️ Гильдия Проводников",rgb:"236,72,153",list:["Славный малый","Влюбленный","Шут"]}];
const ARCH=GUILDS.flatMap(g=>g.list);
// effects: gift (Дар), shadow (Тень), source (Источник: 0 = Общность, 100 = Независимость)
const fx=(gift,shadow,source)=>({gift,shadow,source});
const card=(text,l,lf,r,rf)=>({text,left:{label:l,effects:lf},right:{label:r,effects:rf}});
// Добавляйте новые карточки в массивы ниже через card(...) или обычным объектом.
const questDecks={
"Герой":[card("Спор в общине перерастает в ссору. Вы можете победить силой аргументов.","Настоять на своём",fx(5,15,10),"Искать компромисс",fx(10,-5,-10))],
"Бунтарь":[card("Правило, которое все соблюдают, кажется вам бессмысленным.","Открыто нарушить",fx(5,15,15),"Предложить изменить",fx(10,-5,-5))],
"Маг":[card("Вы видите способ изменить ситуацию, но о нём никто не просил.","Действовать тихо",fx(5,15,10),"Рассказать всем",fx(10,-5,-10))],
"Славный малый":[card("Друг просит поддержать решение, с которым вы не согласны.","Поддержать молча",fx(-5,10,-15),"Сказать честно",fx(10,-5,10))],
"Влюбленный":[card("Близкий человек просит вас отказаться от важной мечты.","Уступить",fx(-5,10,-20),"Отстоять мечту",fx(10,5,15))],
"Шут":[card("На собрании повисла тяжёлая тишина. Шутка разрядит её, но может задеть.","Пошутить",fx(5,10,5),"Промолчать",fx(5,-5,-5))],
"Заботливый":[card("Вы устали, но вас просят помочь ещё раз.","Помочь снова",fx(-5,15,-15),"Отдохнуть",fx(10,-5,15))],
"Творец":[card("Ваша идея не совпадает с ожиданиями заказчика.","Следовать видению",fx(10,5,15),"Подстроиться",fx(-5,10,-10))],
"Правитель":[card("Группе нужно срочное решение, а мнения разделились.","Решить единолично",fx(5,15,15),"Собрать совет",fx(10,-5,-15))],
"Простодушный":[card("Незнакомец просит доверить ему важное дело.","Довериться",fx(5,5,-10),"Проверить",fx(10,-5,5))],
"Искатель":[card("Вам предлагают остаться в уютном месте или отправиться в неизвестность.","Отправиться",fx(10,5,15),"Остаться",fx(5,-5,-10))],
"Мудрец":[card("У вас просят совет, но человеку важнее быть услышанным.","Дать совет",fx(5,10,5),"Просто выслушать",fx(10,-10,-10))]
};
/* ===== ПОДКЛЮЧЕНИЕ ВНЕШНИХ КОЛОД =====
   Файлы-колоды лежат отдельно (creatorsDecks.js и т.п.) и подключаются тегом <script src> выше.
   Формат карточки во внешнем файле: {question, image (необязательно, URL картинки), left:{text,effect}, right:{text,effect}}.
   Колода архетипа из внешнего файла ЗАМЕНЯЕТ тестовую карточку. Новые файлы добавляйте в список ниже. */
const normalizeCard=c=>({text:c.question,image:c.image,left:{label:c.left.text,effects:c.left.effect},right:{label:c.right.text,effects:c.right.effect}});
function mergeDecks(ext){
 for(const a in ext){
  if(!questDecks[a]){console.warn('Неизвестный архетип в колоде:',a);continue}
  const ok=ext[a].filter(c=>c&&c.question&&c.left&&c.right&&c.left.effect&&c.right.effect);
  if(ok.length!==ext[a].length)console.warn('Часть карточек пропущена (неполный формат):',a);
  if(ok.length)questDecks[a]=ok.map(normalizeCard);
 }
}
[typeof creatorsDecks!=='undefined'?creatorsDecks:null
 // , typeof explorersDecks!=='undefined'?explorersDecks:null
].forEach(d=>d&&mergeDecks(d));
const coachingQuestions={
"Герой":["В каких сферах жизни вы проявляете избыточную борьбу там, где можно договориться?","Что для вас означает «победа» без разрушения отношений?","Какую внутреннюю ценность вы защищаете усерднее всего?"],
"Бунтарь":["Что в вашей жизни действительно требует перемен, а что вы отвергаете по привычке?","Какую свободу вы ищете и от чего именно?","Как превратить протест в созидательное действие?"],
"Маг":["Какое преображение вы готовы запустить в себе уже сегодня?","Что в вашей реальности вы можете изменить одним маленьким шагом?","Какую силу вашего влияния важно направлять бережно?"],
"Славный малый":["Где вы ради принадлежности приглушаете собственный голос?","Кто рядом с вами делает вас по-настоящему собой?","Что значит быть «своим» для самого себя?"],
"Влюбленный":["Что вызывает у вас подлинное восхищение и теплоту прямо сейчас?","Где близость с другими требует от вас большей открытости?","Как проявить заботу о себе так же щедро, как о близких?"],
"Шут":["Что в вашей жизни можно воспринять легче и с улыбкой?","За какой шуткой вы прячете важное чувство?","Какая игра вернёт вам радость и живость?"],
"Заботливый":["В чём вы помогаете другим, забывая о собственных потребностях?","Что даёт вам право принять помощь?","Какое служение наполняет вас, а не истощает?"],
"Творец":["Какая идея просит воплощения, пока вы её откладываете?","Что мешает вам показать своё творение миру?","Как несовершенство может стать частью вашего замысла?"],
"Правитель":["За что в вашей жизни вы готовы взять ответственность, а что можно доверить другим?","Как выглядит порядок, в котором есть место живому?","Какое влияние вы хотите оставить после себя?"],
"Простодушный":["Во что вы искренне верите, несмотря на сомнения окружающих?","Где доверие к миру помогает вам, а где стоит прислушаться к интуиции?","Что для вас значит простое счастье?"],
"Искатель":["Каких новых горизонтов или знаний ищет ваша душа в данный момент?","Что мешает вам остановиться и насладиться текущим моментом?","Какое внутреннее пространство вы сейчас исследуете?"],
"Мудрец":["Как накопленный вами опыт и знания могут послужить обществу прямо сейчас?","В чем вы ищете глубинный смысл, упуская простые радости?","Какая истина освобождает вас от внутренних сомнений?"]};

/* ===== STATE & HELPERS ===== */
const $=id=>document.getElementById(id);
const clamp=v=>Math.max(0,Math.min(100,v));
const START={gift:50,shadow:20,source:50};
let arch=null,idx=0,state={...START},busy=false;

/* ===== SCREENS ===== */
function show(id){
 document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('show');if(s.id!==id)s.classList.remove('active')});
 const s=$(id);s.classList.add('active');void s.offsetWidth;requestAnimationFrame(()=>s.classList.add('show'));scrollTo(0,0);
}
function go(id,fn){const cur=document.querySelector('.screen.show');if(cur)cur.classList.remove('show');setTimeout(()=>{fn&&fn();show(id)},cur?350:0)}

/* ===== SCREEN 1 ===== */
const gbox=$('guilds');
GUILDS.forEach(g=>{
 const sec=document.createElement('section');sec.className='guild';sec.style.setProperty('--g',g.rgb);
 sec.innerHTML='<h2></h2><div class="grid"></div>';sec.firstChild.textContent=g.name;
 g.list.forEach(a=>{const b=document.createElement('button');b.className='arch';b.textContent=a;b.onclick=()=>pick(b);sec.lastChild.appendChild(b)});
 gbox.appendChild(sec);
});
const cards=[...document.querySelectorAll('.arch')];
function pick(el){
 if(busy)return;busy=true;
 cards.forEach(c=>c.classList.remove('highlight','selected'));
 el.classList.add('selected');arch=el.textContent;
 setTimeout(()=>go('s2',startQuest),800);
}
$('rnd').onclick=()=>{
 if(busy)return;busy=true;$('s1').classList.add('locked');
 cards.forEach(c=>c.classList.remove('selected'));
 const target=Math.floor(Math.random()*12),N=24,start=(target-(N-1)+120)%12;let i=0,prev;
 (function step(){
  if(prev)prev.classList.remove('highlight');
  const c=cards[(start+i)%12];c.classList.add('highlight');prev=c;
  if(++i<N)setTimeout(step,50+i*i*.35);
  else setTimeout(()=>{c.classList.remove('highlight');busy=false;pick(c)},250);
 })();
};

/* ===== SCREEN 2 ===== */
function render(){
 const g=$('mGift'),s=$('mShadow'),o=$('mSource');
 g.querySelector('.fill').style.width=state.gift+'%';g.querySelector('span').textContent=Math.round(state.gift)+'%';
 s.querySelector('.fill').style.width=state.shadow+'%';s.querySelector('span').textContent=Math.round(state.shadow)+'%';
 s.classList.toggle('alarm',state.shadow>70);
 o.querySelector('.dot').style.left=state.source+'%';o.querySelector('span').textContent=Math.round(state.source)+'%';
}
function startQuest(){
 idx=0;state={...START};
 $('path').textContent='Путь Архетипа: '+arch;render();nextCard();
}
function applyEffects(e){for(const k in e)state[k]=clamp(state[k]+e[k]);render()}
function nextCard(){
 const zone=$('zone'),deck=questDecks[arch]||[];zone.innerHTML='';
 if(idx>=deck.length){setTimeout(()=>go('s3',finish),300);return}
 const d=deck[idx];$('cnt').textContent='Карточка '+(idx+1)+' из '+deck.length;
 const c=document.createElement('div');c.className='swcard';
 c.innerHTML='<div class="pic"></div><div class="hint hl"></div><div class="hint hr"></div>';
 c.children[1].textContent=d.left.label;c.children[2].textContent=d.right.label;
 if(d.image)c.children[0].style.backgroundImage='url("'+d.image+'")';
 const cap=$('qcap');cap.style.opacity=0;setTimeout(()=>{cap.textContent=d.text;cap.style.opacity=1},idx?250:0);
 c.style.opacity=0;c.style.transform='scale(.94)';zone.appendChild(c);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.opacity=1;c.style.transform=''}));
 attachSwipe(c,d);
}
function attachSwipe(c,d){
 let sx=0,dx=0,on=false,done=false;let tapSide=null;const hl=c.children[1],hr=c.children[2];
 c.addEventListener('pointerdown',e=>{if(done)return;const h=e.target.closest('.hint');tapSide=h?(h.classList.contains('hl')?'l':'r'):null;on=true;sx=e.clientX;dx=0;c.classList.add('drag');c.setPointerCapture(e.pointerId)},{passive:true});
 c.addEventListener('pointermove',e=>{
  if(!on)return;dx=e.clientX-sx;
  c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
  const k=Math.min(Math.abs(dx)/90,1);
  hl.style.opacity=dx<0?1:1-.5*k;hr.style.opacity=dx>0?1:1-.5*k;hl.classList.toggle('on',dx<0&&k>=1);hr.classList.toggle('on',dx>0&&k>=1);
 },{passive:true});
 const end=()=>{
  if(!on)return;on=false;c.classList.remove('drag');
  const tap=tapSide&&Math.abs(dx)<=6;
  if(Math.abs(dx)>90||tap){
   done=true;const left=tap?tapSide==='l':dx<0;
   c.style.transform=`translateX(${left?-600:600}px) rotate(${left?-30:30}deg)`;c.style.opacity=0;
   applyEffects((left?d.left:d.right).effects);idx++;setTimeout(nextCard,320);
  }else{c.style.transform='';hl.style.opacity=hr.style.opacity='';hl.classList.remove('on');hr.classList.remove('on')}
 };
 c.addEventListener('pointerup',end,{passive:true});c.addEventListener('pointercancel',end,{passive:true});
}

/* ===== SCREEN 3 ===== */
const nature={
"Герой":["мужество и воля преодолевать трудности","стремление побеждать любой ценой и доказывать свою силу"],
"Бунтарь":["смелость разрушать отжившее и начинать новое","разрушение ради разрушения и отказ от любых правил"],
"Маг":["способность преображать реальность и видеть скрытые связи","манипуляция и соблазн влиять на других втайне"],
"Славный малый":["искренность, теплота и умение принимать людей","угодничество и страх остаться вне группы"],
"Влюбленный":["способность к близости, страсти и глубокому вовлечению","зависимость от одобрения и потеря себя в другом"],
"Шут":["лёгкость, игра и способность видеть жизнь с юмором","уход в шутку от серьёзных чувств и обесценивание важного"],
"Заботливый":["щедрость, сострадание и готовность поддержать","самопожертвование и скрытый упрёк тем, кому вы помогаете"],
"Творец":["воображение и дар воплощать идеи в жизнь","перфекционизм и замыкание в собственном замысле"],
"Правитель":["умение выстраивать порядок и брать ответственность","контроль, властность и страх потерять влияние"],
"Простодушный":["вера, оптимизм и способность видеть хорошее","наивность и отрицание неприятной реальности"],
"Искатель":["жажда открытий и независимость мышления","вечная неудовлетворённость и бегство от привязанностей"],
"Мудрец":["стремление к истине и способность к глубокому анализу","отстранённость и бесконечное обдумывание вместо действия"]};
function summary(){
 const {gift,shadow,source}=state,[gf,sh]=nature[arch];
 const gl=gift>=70?"вы уверенно опираетесь на этот ресурс":gift>=40?"этот ресурс проявляется, но ему есть куда расти":"этот ресурс пока в тени и ждёт вашего внимания";
 const sl=shadow>70?"Тень сейчас сильна: ей нужны осознанность и бережное внимание, а не борьба":shadow>=35?"Тень заметна, и с ней можно вести диалог":"Тень спокойна, и вы хорошо её чувствуете";
 const al=source<40?"Вы склонны смещать фокус на Общность, порой рискуя раствориться в интересах других и потерять собственную аутентичность.":source>60?"Вы держите курс на жесткую Независимость и эгоцентризм, что дает свободу, но может создавать барьеры для истинной синергии в социуме.":"Вы демонстрируете прекрасный внутренний баланс между личными границами и ценностью общего блага.";
 return [`Путь архетипа «${arch}». Ваш Дар — ${gf} (${Math.round(gift)}%): ${gl}. Ваша Тень — ${sh} (${Math.round(shadow)}%). ${sl}.`,al];
}
function finish(){
 $('rev').innerHTML='';summary().forEach(t=>{const p=document.createElement('p');p.textContent=t;$('rev').appendChild(p)});
 $('qs').innerHTML='';(coachingQuestions[arch]||[]).forEach(q=>{const li=document.createElement('li');li.textContent=q;$('qs').appendChild(li)});
}
$('again').onclick=()=>go('s1',()=>{busy=false;arch=null;state={...START};$('s1').classList.remove('locked');cards.forEach(c=>c.classList.remove('highlight','selected'))});
show('s1');
</script>
